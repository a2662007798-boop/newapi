name: Nightly upstream sync & image build

# Merges the latest official main into this private repo every night
# (02:17 Beijing time), then builds and pushes a private image to GHCR.
# A merge conflict fails the run and GitHub emails the repo owner;
# nothing is pushed or built in that case.

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the image even if upstream has no new commits'
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/QuantumNous/new-api.git
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # Pushing upstream changes to .github/workflows is refused for GITHUB_TOKEN,
      # so the push goes through a write deploy key scoped to this repo only.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "nightly-sync"
          git config user.email "nightly-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits:"
            git log --oneline HEAD..upstream/main | head -50
            if ! git merge --no-edit upstream/main; then
              echo "::error::Merge conflict with upstream. Resolve it locally and push; nothing was deployed."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push image
    needs: [sync]
    if: needs.sync.outputs.changed == 'true' || inputs.force_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1

      - name: Resolve version
        id: version
        run: |
          VERSION="custom-$(date -u +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:latest\` and \`${IMAGE}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
