name: Upstream release sync & image build

# Runs every night at 01:17 Beijing time. When the official repo has a new
# release tag, it is merged into main here, then a private image is built
# and pushed to GHCR (the server updates from it at 03:40).
# A merge conflict fails the run and GitHub emails the repo owner;
# nothing is pushed or built in that case.

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the image even if upstream has no new commits'
        required: false
        default: false
        type: boolean

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/QuantumNous/new-api.git
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sync:
    name: Merge latest upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
      tag: ${{ steps.merge.outputs.tag }}
    steps:
      # Pushing upstream changes to .github/workflows is refused for GITHUB_TOKEN,
      # so the push goes through a write deploy key scoped to this repo only.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Merge latest upstream release
        id: merge
        run: |
          git config user.name "nightly-sync"
          git config user.email "nightly-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"

          # versionsort.suffix makes v1.0.0 sort above v1.0.0-rc.N.
          TAG=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname upstream 'v*' \
            | head -1 | sed 's#.*refs/tags/##')
          if [ -z "$TAG" ]; then
            echo "::error::No upstream release tag found"
            exit 1
          fi
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "Already contains $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits:"
            git log --oneline "HEAD..$TAG" | head -50
            if ! git merge --no-edit -m "Merge upstream release $TAG" "$TAG"; then
              echo "::error::Merge conflict with upstream. Resolve it locally and push; nothing was deployed."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push image
    needs: [sync]
    if: needs.sync.outputs.changed == 'true' || inputs.force_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ needs.sync.outputs.tag }}-custom-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Ship the server update script inside the image so the server can
          # fetch it with the registry login it already has. The official
          # Dockerfile stays untouched; its last stage is the runtime image.
          cp Dockerfile Dockerfile.custom
          printf '\nCOPY deploy/nightly-update.sh /opt/deploy/nightly-update.sh\n' >> Dockerfile.custom

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:latest\` and \`${IMAGE}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
